<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1233"/>
      <stop offset="55%" stop-color="#241a45"/>
      <stop offset="100%" stop-color="#170f2e"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c15a"/>
      <stop offset="100%" stop-color="#c99a2e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- subtle grid accent lines -->
  <g stroke="#3a3564" stroke-width="1" opacity="0.35">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- kicker -->
  <text x="640" y="90" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="30" font-weight="600" fill="#c9b6f5" text-anchor="middle" letter-spacing="2">マーケティング構造を読み解く</text>

  <!-- main title -->
  <text x="640" y="150" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="56" font-weight="800" fill="#f4efe3" text-anchor="middle">
    <tspan fill="#e8c15a">「価値の転化」</tspan>で読み解く
  </text>
  <text x="640" y="215" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="56" font-weight="800" fill="#f4efe3" text-anchor="middle">顕正会員の操作術</text>

  <!-- diagram: organization value box -->
  <g filter="url(#softShadow)">
    <rect x="120" y="300" width="380" height="170" rx="18" fill="#1c2454" stroke="#5a6bd6" stroke-width="2"/>
  </g>
  <text x="310" y="365" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="34" font-weight="700" fill="#dfe3ff" text-anchor="middle">組織の価値</text>
  <text x="310" y="405" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="22" fill="#a9b0e8" text-anchor="middle">組織の維持・発展</text>
  <text x="310" y="435" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="22" fill="#a9b0e8" text-anchor="middle">（会員拡大・組織防衛）</text>

  <!-- diagram: individual value box -->
  <g filter="url(#softShadow)">
    <rect x="780" y="300" width="380" height="170" rx="18" fill="#3a1f4d" stroke="#c98bd9" stroke-width="2"/>
  </g>
  <text x="970" y="365" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="34" font-weight="700" fill="#f5e6ff" text-anchor="middle">個人の価値</text>
  <text x="970" y="405" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="22" fill="#dcb8ee" text-anchor="middle">一生成仏・功徳</text>
  <text x="970" y="435" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="22" fill="#dcb8ee" text-anchor="middle">（折伏・結集への精進）</text>

  <!-- arrow connecting the two boxes -->
  <path d="M 510 385 L 760 385" stroke="url(#arrowGrad)" stroke-width="10" fill="none"/>
  <path d="M 760 385 L 725 362 L 725 408 Z" fill="url(#arrowGrad)"/>

  <!-- label on the arrow -->
  <rect x="565" y="345" width="130" height="52" rx="26" fill="#100a22" stroke="#e8c15a" stroke-width="2"/>
  <text x="630" y="379" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="28" font-weight="800" fill="#e8c15a" text-anchor="middle">転化</text>

  <!-- footer -->
  <text x="640" y="650" font-family="'IPAGothic','IPAゴシック',sans-serif" font-size="28" font-weight="600" fill="#cfc9ec" text-anchor="middle">組織の価値は、なぜ個人の言葉に姿を変えるのか</text>
</svg>
