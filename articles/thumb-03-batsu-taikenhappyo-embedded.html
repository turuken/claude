<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 670px;
    font-family: 'IPAGothic', 'IPAPGothic', sans-serif;
    overflow: hidden;
  }
  .canvas {
    width: 1280px;
    height: 670px;
    position: relative;
    background: linear-gradient(135deg, #fef9ec 0%, #eaf7f0 55%, #dcf3e8 100%);
    overflow: hidden;
  }

  /* 日の出・光のモチーフ */
  .sun {
    position: absolute;
    top: -260px;
    right: -160px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0%, #ffe9b3 55%, rgba(255,233,179,0) 75%);
  }
  .rays {
    position: absolute;
    top: -260px;
    right: -160px;
    width: 560px;
    height: 560px;
  }
  .ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 420px;
    background: #ffe9b3;
    opacity: 0.5;
    transform-origin: top center;
  }

  .bg-circle {
    position: absolute;
    border-radius: 50%;
  }
  .bg-circle.c2 { width: 260px; height: 260px; bottom: -100px; left: -80px; background: #9be8d0; opacity: 0.45; }

  .tag {
    position: absolute;
    top: 62px;
    left: 90px;
    display: inline-flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #cdeee0;
    color: #1f6a52;
    font-size: 24px;
    padding: 9px 24px;
    border-radius: 999px;
    letter-spacing: 2px;
    box-shadow: 0 4px 14px rgba(31,106,82,0.12);
  }

  .catch {
    position: absolute;
    top: 132px;
    left: 90px;
    color: #e2483d;
    font-size: 40px;
    font-weight: bold;
  }

  .title {
    position: absolute;
    top: 196px;
    left: 90px;
    color: #1e2d2a;
    font-size: 52px;
    line-height: 1.32;
    font-weight: bold;
    max-width: 1020px;
  }

  .sub-row {
    position: absolute;
    top: 452px;
    left: 90px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .sub-row .dove { font-size: 30px; }
  .sub {
    color: #1f8f6e;
    font-size: 27px;
    font-weight: bold;
  }

  .path {
    position: absolute;
    left: 90px;
    top: 505px;
    width: 340px;
    height: 3px;
    background: linear-gradient(90deg, #9be8d0 0%, rgba(155,232,208,0) 100%);
  }

  .profile {
    position: absolute;
    bottom: 30px;
    right: 90px;
    width: 165px;
    height: 165px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #ffffff;
    box-shadow: 0 8px 22px rgba(31,106,82,0.22);
  }
  .profile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
